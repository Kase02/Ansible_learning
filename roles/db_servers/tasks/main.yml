- name: installing mariadb package (Ubuntu)
  tags: db,mariadb,Ubuntu
  apt:
    name: mariadb-server
    state: latest
  when: ansible_facts["distribution"] == "Ubuntu"

- name: installing mariadb package (CentOS)
  tags: db, mariadb,CentOS
  dnf:
    name: mariadb
    state: latest
  when: ansible_facts["distribution"] == "CentOS"
