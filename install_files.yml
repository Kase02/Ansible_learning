
---
- hosts: all
  become: true
  tasks:
    - name: install updates (Ubuntu)
      tags: always
      apt:
        upgrade: dist
        update_cache: yes
      when: ansible_facts["distribution"] == "Ubuntu"

- hosts: web_servers
  become: true
  gather_facts: no
  tasks:
    - name: install apache2 and php package for Ubuntu
      tags: apache,apache2,Ubuntu
      apt:
        name:
          - apache2
          - libapache2-mod-php
        state: latest
      when: ansible_facts["distribution"] == "Ubuntu"

    - name: Copy default file for install_file
      tags: apache,apache2,Ubuntu
      copy:
        src: default_site.html
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: 0644


- hosts: db_servers
  become: true
  gather_facts: no
  tasks:
    - name: installing mariadb package (Ubuntu)
      tags: db,mariadb,Ubuntu
      apt:
        name: mariadb-server
        state: latest
      when: ansible_distribution == "Ubuntu"

- hosts: file_servers
  become: true
  gather_facts: no
  tasks:
    - name: installing samba for Ubuntu
      tags: samba
      package:
        name: samba
        state: latest
