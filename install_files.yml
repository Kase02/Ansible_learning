---
- hosts: all
  become: true
  tasks:
    - name: install updates (Ubuntu)
      apt:
        upgrade: dist
        update_cache: yes
      when: ansible_facts["distribution"] == "Ubuntu"

- hosts: web_servers
  become: true
  gather_facts: no
  tasks:
    - name: install apache2 and php package for Ubuntu
      apt:
        name:
          - apache2
          - libapache2-mod-php
        state: latest
      when: ansible_facts["distribution"] == "Ubuntu"

- hosts: db_servers
  become: true
  gather_facts: no
  tasks:
    - name: installing mariadb package (Ubuntu)
      apt:
        name: mariadb-server
        state: latest
      when: ansible_distribution == "Ubuntu"

- hosts: file_servers
  become: true
  gather_facts: no
  tasks:
    - name: installing samba for Ubuntu
      package:
        name: samba
        state: latest
